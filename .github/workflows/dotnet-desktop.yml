# TTwen continuous integration workflow
# Purpose:
# - Verify the complete C#/.NET 10 solution on a Windows runner.
# - Restore all NuGet dependencies.
# - Build the WinUI 3 application and supporting projects for x64.
# - Run the automated test suite.
# - Publish a self-contained Windows x64 test artifact.
# - Smoke-test that the published WinUI executable starts.
#
# This workflow validates the repository; it does not start the bot or keep
# the desktop application running after the smoke test.

name: TTwen - .NET Desktop CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttwen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and publish TTwen
    runs-on: windows-2022

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      TTWEN_TEST_VERSION: "0.5.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          architecture: x64

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Restore solution
        run: dotnet restore TTwen.sln

      - name: Build solution
        run: dotnet build TTwen.sln --configuration Release -p:Platform=x64 --no-restore

      - name: Run unit tests
        run: dotnet test tests/TTwen.Tests/TTwen.Tests.csproj --configuration Release --no-restore --no-build --logger "trx;LogFileName=ttwen-tests.trx"

      - name: Publish Windows x64 test build
        shell: pwsh
        run: dotnet publish src/TTwen.App/TTwen.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -p:Version=$env:TTWEN_TEST_VERSION -p:PublishTrimmed=false -p:PublishSingleFile=false -p:PublishReadyToRun=false --no-restore --output "artifacts/TTwen-v$env:TTWEN_TEST_VERSION-test"

      - name: Verify published WinUI resource index
        shell: pwsh
        run: |
          $publishDir = Resolve-Path "artifacts/TTwen-v$env:TTWEN_TEST_VERSION-test"
          $pri = Get-ChildItem -Path $publishDir -Filter "*.pri" -File -ErrorAction SilentlyContinue
          if ($pri.Count -eq 0) {
            throw "Publish çıktısında hiçbir PRI dosyası bulunamadı. WinUI XAML kaynakları çalışamaz."
          }
          $projectPriName = "TTwen.App.pri"
          if (-not (Test-Path (Join-Path $publishDir $projectPriName))) {
            throw "$projectPriName publish çıktısında bulunamadı."
          }
          Write-Host "Bulunan PRI dosyaları:"
          $pri | Select-Object Name, Length | Format-Table

      - name: Smoke-test published executable
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path "artifacts/TTwen-v$env:TTWEN_TEST_VERSION-test") "TTwen.App.exe"
          if (-not (Test-Path $exe)) {
            throw "TTwen.App.exe publish çıktısında bulunamadı."
          }

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          if ($process.HasExited) {
            Write-Host "TTwen.App.exe erken kapandı. Son Windows Application olayları:"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddSeconds(-30) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @('Application Error', 'Windows Error Reporting', '.NET Runtime') } |
              Select-Object -First 10 TimeCreated, ProviderName, Id, LevelDisplayName, Message |
              Format-List
            throw "TTwen.App.exe başlangıç smoke testinde $($process.ExitCode) koduyla kapandı."
          }

          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

      - name: Package Windows x64 test build
        shell: pwsh
        run: Compress-Archive -Path "artifacts/TTwen-v$env:TTWEN_TEST_VERSION-test/*" -DestinationPath "artifacts/TTwen-v$env:TTWEN_TEST_VERSION-test.zip" -Force

      - name: Upload Windows x64 test artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTwen-v0.5.2-test-windows-x64
          path: artifacts/TTwen-v0.5.2-test.zip
          if-no-files-found: error

      - name: Publish test results
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "tests/TTwen.Tests/TestResults") {
            Get-ChildItem "tests/TTwen.Tests/TestResults" -Recurse | Select-Object FullName, Length
          }
