[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttwen"
version = "0.1.0"
description = "TTWars automation and oasis profitability assistant"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "playwright>=1.48,<2"
]

[tool.setuptools]
packages = ["ttwen"]
